name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          # a job that can publish does not restore a cache that other runs could have written to
          package-manager-cache: false

      - name: Upgrade NPM to latest
        run: npm install -g npm@latest

      - name: Set package version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a valid semver version (expected e.g. v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Pre-releases are published under the "next" dist-tag so they don't become "latest".
      # `npm publish` runs prepublishOnly, which builds the dist files.
      - name: Build and publish package
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$NPM_TAG"

      - name: Attach distribution files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/expression-language.js \
            dist/expression-language.min.js \
            dist/index.d.ts \
            --clobber

  # Keep package.json on main in sync with what was just published.
  sync-version:
    needs: publish-npm
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Commit released version to main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "main is already at $VERSION"
            exit 0
          fi
          # Don't move main backwards when releasing from an older line (e.g. a 1.x patch).
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" = "$CURRENT" ]; then
            echo "main ($CURRENT) is already ahead of $VERSION; leaving it alone"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git push origin main
